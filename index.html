<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The build puts its Content-Security-Policy here (src/platform/csp.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>ngplatform</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- IBM Plex, served with the app (public/fonts). -->
    <link rel="stylesheet" href="./fonts/plex.css" />
    <!-- The loading screen, shown until main.ts has built the shell: over the
         page rather than in it, so nothing moves when it goes. -->
    <style>
      html { background: #000; }
      .boot { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-content: center; justify-items: center; gap: 12px; background: #000; color: #949494; font: 13px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
      .boot-bar { width: 160px; height: 2px; background: #262626; overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #d0d0d0; animation: boot-slide 1.2s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <span>Loading ngplatform…</span>
      <span class="boot-bar" aria-hidden="true"></span>
      <noscript>ngplatform needs JavaScript.</noscript>
    </div>
    <div id="app" class="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
