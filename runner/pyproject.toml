[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngplatform-runner"
version = "0.1.0"
description = "Runs zarr-vectors-tools jobs on this computer for ngplatform, and serves files to its viewer."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# The runner itself needs only the standard library.  Its jobs run
# zarr-vectors-tools (and numpy), in the Python given with --python
# (by default the runner's own).
dependencies = []

[project.optional-dependencies]
jobs = ["zarr-vectors-tools"]
# The render service (ngplatform_render), on a computer with an NVIDIA GPU.
render = ["numpy", "zarr>=3", "fsspec", "aiohttp", "pillow", "cupy-cuda12x"]
# Fitting splats (the render service's --splat-python, a Python of its own): torch with CUDA, and the gsplat
# whose API splat/fit.py is written against (GSPLAT_VERSION there).
splat = ["numpy", "pillow", "torch", "gsplat==1.4.0"]
# The tests (runner/tests), as CI runs them: without a GPU the render tests
# that need CuPy skip, as do the filter tests without zarr-vectors-tools.
test = ["pytest", "numpy", "zarr>=3", "fsspec", "aiohttp", "pillow"]

[project.scripts]
ngplatform-runner = "ngplatform_runner.__main__:main"

[tool.setuptools]
packages = ["ngplatform_runner", "ngplatform_runner.tasks", "ngplatform_render"]

[tool.setuptools.package-data]
ngplatform_render = ["params.json", "presets/*.json", "lightmaps/*.npy", "lightmaps/credits.json"]
