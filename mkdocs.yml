site_name: ngplatform
site_description: A workspace around Neuroglancer, extended by plugins.
site_url: https://ngplatform.readthedocs.io/
repo_url: https://github.com/AllenInstitute/ngplatform
repo_name: AllenInstitute/ngplatform
edit_uri: edit/main/docs/

theme:
  name: material
  logo: logo.svg
  favicon: logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys

nav:
  - Home: index.md
  - User guide:
      - The window, part by part: guide/interface.md
      - Loading and exporting data: guide/data.md
      - Signing in: guide/signing-in.md
      - Jobs on this computer: guide/local-jobs.md
      - Coming from Freeview: guide/from-freeview.md
      - Coming from Neuroglancer: guide/from-neuroglancer.md
  - Plugins:
      - plugins/index.md
      - Zarr Vectors: plugins/zarr-vectors.md
      - Track filtering: plugins/track-filtering.md
      - Annotations: plugins/annotations.md
      - Segmentation: plugins/segmentation.md
      - "Drawing labels: a survey": plugins/segmentation-survey.md
      - Registration: plugins/registration.md
      - Anatomical rendering: plugins/anatomical-rendering.md
      - Collections: plugins/collections.md
      - Filters: plugins/filters.md
      - Luxar rendering: plugins/luxar.md
      - Orientations: plugins/orientations.md
      - Atlas: plugins/atlas.md
      - Time series: plugins/time-series.md
      - Ideas for new plugins: plugins/ideas.md
      - Page template: plugins/template.md
      - SDK reference: plugins/sdk.md
  - Contributing: contributing.md
  - Development:
      - "Audit, part 1: platform and seven plugins": dev/audit.md
      - "Audit, part 2: annotations to capture": dev/audit-2.md
      - "Speed: startup, bundle, first image, memory, drawing": dev/speed.md
      - "Workflows: ten tasks, counted": dev/workflows.md
      - "Code review: shared helpers, dead code, bugs, tests": dev/code-review.md
      - "Cinematic Anatomy, and where Anatomical rendering stands": dev/cinematic-anatomy-survey.md
      - "Anatomical rendering: the remaining features": dev/cinematic-roadmap.md
      - "Security: what the app protects, and what it allows": dev/security.md
      - "Casts into Neuroglancer's internals": dev/neuroglancer-casts.md
      - "Patches for the Neuroglancer fork": fork-patches/README.md
